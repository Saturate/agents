# skill-router rules, read by the hooks module (hooks/register.ts).
#
# Format: <action><TAB><extended-regex><TAB><skill-or-gate-name>[<TAB><message>]
#
# Actions:
#   block      : A Bash command is refused until the named skill (or every
#                 skill in a comma-separated list) has loaded in this
#                 conversation, through the Skill tool or /name.
#   gate       : The person approves the Bash command in a dialog that shows
#                 it in full. In `claude -p` nobody can, so it is refused.
#   block-tool : Like block, matched against a tool's name (MCP tools).
#   gate-tool  : Like gate, matched against a tool's name.
#
# Each simple command in a Bash call (split on && || ; | and $(...)) is
# matched on its own, after quoted strings and heredoc bodies are blanked.
# The first matching rule wins per command, so order specific rules before
# general ones. Patterns use grep -E syntax, POSIX classes included.

# ── External-facing content (gate: draft first, then post) ──────────
# Creating an issue or commenting on a PR is external-facing.
gate	^[[:space:]]*gh[[:space:]]+issue[[:space:]]+create	draft-first	This creates a public issue.
gate	^[[:space:]]*gh[[:space:]]+pr[[:space:]]+review	draft-first	This posts a review on someone else's PR.
gate	^[[:space:]]*gh[[:space:]]+pr[[:space:]]+comment	draft-first	This posts a public comment.
gate	^[[:space:]]*az[[:space:]]+repos[[:space:]]+pr[[:space:]]+create[[:space:]]+-+thread	draft-first	This posts a comment on an Azure DevOps PR.

# ── Destructive git operations (gate: confirm before proceeding) ─────
# Force push and hard reset can destroy history/work. Order these BEFORE
# the general git push block so they get a different, stronger message.
gate	^[[:space:]]*git[[:space:]]+push([[:space:]]+.*)?[[:space:]](-[[:alpha:]]*f[[:alpha:]]*|--force(-with-lease)?|\+[^[:space:]]+)([[:space:]=]|$)	confirm-destructive	This force-pushes, which rewrites remote history.
gate	^[[:space:]]*git[[:space:]]+reset[[:space:]]+--hard	confirm-destructive	git reset --hard discards uncommitted changes permanently.

# ── Irreversible external actions (gate: confirm) ───────────────────
gate	^[[:space:]]*gh[[:space:]]+repo[[:space:]]+fork	confirm-external	This forks a repository to your GitHub account (irreversible).

# ── Package installation (block: invoke evaluating-dependencies) ─────
block	^[[:space:]]*(npm|pnpm|yarn|bun)[[:space:]]+(install|add|i)[[:space:]]+[^-[:space:]]	evaluating-dependencies
block	^[[:space:]]*cargo[[:space:]]+add[[:space:]]+[^-[:space:]]	evaluating-dependencies
block	^[[:space:]]*(pip|pip3|uv)[[:space:]]+(install|add)[[:space:]]+[^-[:space:]]	evaluating-dependencies
block	^[[:space:]]*go[[:space:]]+get[[:space:]]+[^[:space:]]+@	evaluating-dependencies
block	^[[:space:]]*dotnet[[:space:]]+add[[:space:]]+package[[:space:]]+[^-[:space:]]	evaluating-dependencies,nuget-package-management

# ── Commits (block: invoke commit skill) ─────────────────────────────
block	^[[:space:]]*git[[:space:]]+commit	commit

# ── Pull requests and push (block: invoke skill) ────────────────────
block	^[[:space:]]*gh[[:space:]]+pr[[:space:]]+create	make-pr
block	^[[:space:]]*az[[:space:]]+repos[[:space:]]+pr[[:space:]]+create	make-pr
block	^[[:space:]]*git[[:space:]]+push	push

# ── Destructive recursive deletion (block: invoke safe-delete) ───────
block	^[[:space:]]*rm[[:space:]]+(.*[[:space:]])?(--recursive|-[[:alpha:]]*[rR][[:alpha:]]*)([[:space:]]|$)	safe-delete

# ── MCP tools ───────────────────────────────────────────────────────
gate-tool	^mcp__.+__(repo_create_pull_request|repo_pull_request_write)$	confirm-external	This creates, updates, votes on or abandons a pull request.
gate-tool	^mcp__.+__(repo_pull_request_thread_write|wit_work_item_comment_write)$	draft-first	This posts a comment on a pull request or work item.
